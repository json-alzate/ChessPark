<ion-content [fullscreen]="true" class="ion-padding">
  <div class="block-presentation">
    <div class="block-presentation__text">
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>

    <img [src]="image" [alt]="title" />

    <ion-button size="large" (click)="closeAndStart()">
      {{ 'PUZZLES.general.start' | transloco }} &nbsp; <small> ({{ timer }}) </small>
    </ion-button>
  </div>
</ion-content>
