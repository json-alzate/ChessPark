@if (!isPlaying) {
<div class="flex justify-between items-center">
  <div class="join join-horizontal">
    <button
      class="join-item btn btn-sm"
      [class.btn-neutral]="boardOrientation === 'white'"
      [class.btn-ghost]="boardOrientation !== 'white'"
      (click)="onOrientationChange('white')"
    >
      <img
        [src]="'white' | kingImage"
        [alt]="'APP.components.whiteKing' | transloco"
        class="size-6"
      />
    </button>
    <button
      class="join-item btn btn-sm"
      [class.btn-neutral]="boardOrientation === 'random'"
      [class.btn-ghost]="boardOrientation !== 'random'"
      (click)="onOrientationChange('random')"
    >
      <ion-icon name="shuffle-outline" class="size-6"></ion-icon>
    </button>

    <button
      class="join-item btn btn-sm"
      [class.btn-neutral]="boardOrientation === 'black'"
      [class.btn-ghost]="boardOrientation !== 'black'"
      (click)="onOrientationChange('black')"
    >
      <img
        [src]="'black' | kingImage"
        [alt]="'APP.components.blackKing' | transloco"
        class="size-6"
      />
    </button>
  </div>
</div>
}
